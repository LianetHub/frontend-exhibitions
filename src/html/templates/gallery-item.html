@@before<div class="@@col" data-gallery-cell data-genre="@@genre" data-technique="@@technique">
	<a class="gallery-item@@if(typeof ratio !== 'undefined' && ratio){ @@ratio}" href="@@src" data-fancybox="gallery" data-caption="@@caption">
		<img class="gallery-item__img" src="@@src" alt="@@alt" width="875" height="585"@@if(typeof priority !== 'undefined' && priority){ fetchpriority="high"}@@if(typeof priority === 'undefined' || !priority){ loading="lazy"}>
		<span class="gallery-item__caption">
			<span class="gallery-item__top">
				<span class="gallery-item__name">@@name</span>
				<span class="gallery-item__size">@@size</span>
			</span>
			<span class="gallery-item__meta">
				<span>@@genreLabel</span>
				<span class="gallery-item__sep" aria-hidden="true"></span>
				<span>@@techniqueLabel</span>
				<span class="gallery-item__avail@@if(typeof available !== 'undefined' && !available){ gallery-item__avail--sold}">@@if(typeof available === 'undefined' || available){Можно приобрести}@@if(typeof available !== 'undefined' && !available){В коллекции}</span>
			</span>
		</span>
	</a>
</div>@@after
