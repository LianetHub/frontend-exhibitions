<div class="swiper-slide">
	<figure class="gallery-card">
		<div class="gallery-card__frame">
			<img class="gallery-card__img" src="@@src" alt="@@alt" width="457" height="300" loading="lazy">
		</div>
		<figcaption class="gallery-card__caption">
			<p class="gallery-card__name">@@name</p>
			<p class="gallery-card__meta">
				<span>@@genreLabel</span>
				<span class="gallery-card__sep" aria-hidden="true"></span>
				<span>@@techniqueLabel</span>
			</p>
		</figcaption>
	</figure>
</div>
