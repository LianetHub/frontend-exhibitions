<section class="exhibitions-hero">
	<div class="exhibitions-hero__inner container">
		<div class="exhibitions-hero__layout">
			<h1 class="exhibitions-hero__title">
				<img
					class="exhibitions-hero__title-img"
					src="@img/exhibitions/title-exhibitions.svg"
					alt="Выставки"
					width="581"
					height="178"
					fetchpriority="high">
			</h1>
			<div class="exhibitions-hero__aside" data-exhibitions-filters>
				<div class="exhibitions-hero__chips">
					<button type="button" class="exhibitions-hero__chip" data-city="Краснодар">Г. Краснодар</button>
					<button type="button" class="exhibitions-hero__chip" data-city="Майкоп">Г. Майкоп</button>
					<button type="button" class="exhibitions-hero__chip" data-city="Елабуга">Г. Елабуга</button>
					<button type="button" class="exhibitions-hero__chip" data-city="Курган">Г. Курган</button>
					<button type="button" class="exhibitions-hero__chip" data-city="Сочи">Г. Сочи</button>
				</div>
				<a class="exhibitions-hero__cta" href="gallery.html">Посмотреть картины в интерьере</a>
			</div>
		</div>
	</div>
	<div class="band band--wood" aria-hidden="true"></div>
</section>
